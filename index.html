(function(){
 // The drawer. Plain class toggle rather than a framework, and the button
 // carries aria-expanded so a screen reader is told what it did.

 // THE CLASS GOES ON `.app`, NOT `.side`. The rail's width is a grid
 // column on the parent, and a child cannot change its own track -- the
 // popover version could live on `.side` because it never moved the
 // layout. Everything keyed on it was moved with it.
 var app=document.querySelector('.app');
 if(!b||!side||!app) return;

   var open=app.classList.toggle('open');
   b.setAttribute('aria-expanded',open?'true':'false');
 });

 // leaving; `peek` follows the pointer and nothing else. The rail shows
 // for either, so unpinning while still hovering leaves it open under the
 // cursor rather than snapping shut in your face.
 //
 // FINE POINTERS ONLY. On a touch screen a tap raises a synthetic hover
 // that never ends, so the rail would open on the first tap and stay
 // there with no way to dismiss it -- the control would have one state
 // instead of three. Click alone works everywhere, which is also what
 // keeps this reachable from a keyboard.

   side.addEventListener('pointerenter',function(){ app.classList.add('peek'); });
   side.addEventListener('pointerleave',function(){ app.classList.remove('peek'); });
 }

 // but the chat page answers in place and a drawer left open over the
 // answer is the kind of thing only someone on a phone ever finds.
 side.addEventListener('click',function(e){
   if(e.target.closest('nav a')){ close(); }
 });

   b.setAttribute('aria-expanded','false'); }

 // pressing the same button is a trap -- the rest of the page is still
 // right there and clicking it should dismiss. Escape too, because the
 // panel takes focus from a page whose whole purpose is a text box.
 // AN EXPANDED RAIL IS NOT A POPOVER, so a click on the page must not
 // dismiss it -- that behavior belonged to the panel that covered the
 // content. Escape still closes, because the rail can take focus.

   if(e.key==='Escape' && app.classList.contains('open')){ close(); b.focus(); }
 });

(function(){
 // THE API IS A DIFFERENT ORIGIN. A bare '/api/widget' resolves against
 // slatestats.com, which serves static files and knows nothing about it --
 // so the pin posted into the void and reported "Could not keep" to a
 // reader who was simply not signed in. Every other fetch on this site
 // already goes through SLATE_API; this one is no different, and the local
 // test could never see it because there the API IS same-origin.
 var API=(window.SLATE_API||'').replace(/\/$/,'');
 function esc(t){ return String(t==null?'':t)
   .replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;',
     '>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 // A CHART'S NAME COMES FROM THE CHART. `aria-label` is what the SVG
 // already tells a screen reader, so the gallery cannot caption a figure
 // differently from how it announces itself.
 function labelOf(svg, i){
   var m = /aria-label="([^"]*)"/.exec(svg);
   return m && m[1] ? m[1] : ('Chart ' + (i+1));
 }
 // THE PIN IS PART OF THE FIGURE, not of one of the two callers. Both
 // renderers ask this function for markup, which is the whole reason it
 // exists -- the last time a chart feature was added to one of them the
 // other silently kept the old behavior.
 function pin(q, cid, title, keptId){
   if(!q || !q.tool || !cid) return '';
   // THE KEPT STATE IS PASSED IN, because `mark()` REDRAWS THIS BUTTON on
   // every scroll and every press. Rendering it as "Keep" unconditionally
   // meant keeping chart 2, moving to 3 and coming back showed "Keep" on a
   // chart that is kept -- a control reporting a state the page is not in,
   // which is the exact fault the counter and the arrows already had here.
   var on = keptId != null;
   return '<button class="fig-pin" data-tool="'+esc(q.tool)
     +'" data-args="'+esc(JSON.stringify(q.args||{}))
     +'" data-chart="'+esc(cid)+'" data-title="'+esc(title)+'" '
     +(on ? 'data-id="'+esc(keptId)+'" ' : '')
     +'aria-pressed="'+(on?'true':'false')+'" '
     +'aria-label="'+(on?'Remove this chart from your dashboard'
                        :'Keep this chart on your dashboard')+'">'
     +'<span class="fig-pin-i" aria-hidden="true"></span>'
     +'<span class="fig-pin-t">'+(on?'Kept':'Keep')+'</span></button>';
 }
 // WHICH CHARTS THIS GALLERY HAS KEPT, on the element rather than in a
 // closure: the gallery is built as a string, so there is no object to
 // hold it, and a page can carry several galleries at once.
 function keptMap(g){
   try { return JSON.parse(g.getAttribute('data-kept') || '{}'); }
   catch(e){ return {}; }
 }
 function setKept(g, cid, id){
   var m = keptMap(g);
   if(id == null) delete m[cid]; else m[cid] = id;
   g.setAttribute('data-kept', JSON.stringify(m));
 }

   figs = figs || []; ids = ids || [];
   if(!figs.length) return '';
   if(figs.length === 1)
     return '<div class="fig">'+figs[0]
       +'<div class="fig-bar">'+pin(query, ids[0], labelOf(figs[0],0), null)
       +'</div></div>';

     return '<div class="gal-slide" role="group" aria-roledescription="slide" '
       +'aria-label="'+esc(labelOf(f, i))+'">'+f+'</div>'; }).join('');

     return '<button class="gal-dot'+(i===0?' on':'')+'" data-go="'+i+'" '
       +'aria-label="'+esc(labelOf(f, i))+'"></button>'; }).join('');

     + (chatId ? ' data-chat="'+chatId+'"' : '')
     // ON THE ELEMENT, NOT ON A JS PROPERTY. The gallery is returned as a
     // STRING and parsed by whoever inserts it, so there is no object to
     // hang a property on -- `g._q` would be undefined on every gallery
     // ever drawn and the pin would silently never appear.
     + ' data-ids="'+esc(JSON.stringify(ids))+'"'
     + (query && query.tool ? ' data-q="'+esc(JSON.stringify(query))+'"' : '')
     + '>'
     +'<div class="gal-view">'+slides+'</div>'
     +'<div class="gal-bar">'
       +'<button class="gal-prev" aria-label="Previous chart">&larr;</button>'
       +'<button class="gal-next" aria-label="Next chart">&rarr;</button>'
       +'<span class="gal-at"><b>1</b> of '+figs.length+'</span>'
       +'<span class="gal-dots">'+dots+'</span>'
       +(query && query.tool ? '<span class="gal-pin"></span>' : '')
     +'</div></div>';

   //

   // mandatory`, a programmatic SMOOTH scroll does nothing at all --
   // scrollLeft stayed 0 while the identical call with `behavior:'auto'`
   // moved it to 720. The snap and the smooth animation fight, and the
   // snap wins by canceling it. Nothing is logged; the buttons simply do
   // not work, which is exactly how this shipped to a screenshot.

   // there is a jump, and a swipe animates itself.

   // and the arrows stayed on "1 of 4" through every button press while
   // the track moved correctly underneath them -- a control reporting a
   // state the page is not in. The scroll listener stays for the swipe,
   // where there is no button press to hang this off.

   // they are looking at, and a row of five identical Keep buttons in a

   var slot = g.querySelector('.gal-pin');

 function acctMenu(el){
   var b=el.querySelector('#acctbtn'), m=el.querySelector('#acctmenu');
   if(!b||!m) return;
   function shut(){ m.hidden=true; b.setAttribute('aria-expanded','false'); }
   b.addEventListener('click',function(e){
     e.stopPropagation();
     var open=m.hidden; m.hidden=!open;
     b.setAttribute('aria-expanded',open?'true':'false');
     if(open) m.querySelector('[role=menuitem]').focus();
   });
   // A MENU MUST BE DISMISSIBLE BY THE THINGS THAT DISMISS MENUS.
   // Clicking away and Escape, and Escape returns focus to the button so
   // a keyboard user is not dropped at the top of the document.
   document.addEventListener('click',function(e){
     if(!m.hidden && !e.target.closest('.whorow')) shut();
   });
   document.addEventListener('keydown',function(e){
     if(e.key==='Escape' && !m.hidden){ shut(); b.focus(); }
   });
   // SIGN OUT IS A POST. As a link it was a state change reachable by
   // navigation, which is why it needed a Referer check to stop an <img>
   // on someone else's page ending our visitors' sessions. A POST cannot
   // be made by an image, a link or a prefetch at all.
   var out=el.querySelector('#signout');
   if(out) out.addEventListener('click',function(){
     out.disabled=true;
     fetch(API+'/auth/signout',{method:'POST',credentials:'include'})
       .then(function(){ location.reload(); })
       .catch(function(){ out.disabled=false; });
   });
 }
 fetch(API+'/api/me',{credentials:'include'})
  .then(function(x){return x.json();}).then(function(j){
   if(j.signed_in){
     // NO IDENTITY IN THE SIDEBAR. It showed the part of the address
     // before the @, which is not a name and is PII on a panel that gets
     // read over shoulders. A name would be fine, but we cannot promise
     // one for every provider -- Apple lets people hide even that -- and a
     // field that is a name for some users and an address fragment for
     // others is not a field worth having. The icon says "you are signed
     // in"; the account page, which you open deliberately, says who.
     // ICON ONLY. The word "Account" next to a person icon is the icon
     // said twice, and this rail is the quiet edge of the page. The link
     // still carries a title and an aria-label, because an icon with no
     // accessible name is a button that screen readers cannot announce.
     // NO TIER BADGE. "Free" told a reader nothing they can act on --
     // it is a fact about our billing, not about their account -- and a
     // colored pill is the loudest thing on a quiet rail. Plan lives on
     // the account page, next to what it would change.
     //
     // AND SIGN OUT GOES BEHIND A MENU. It was a bare link one stray
     // click from ending the session, beside the link people actually
     // want. A menu is also where it belongs: the row is an identity,
     // and the things you can DO with an identity hang off it.
     //
     // CLICK, NOT HOVER, and that is the accessibility decision rather
     // than a taste one. A hover menu cannot be reached from a keyboard
     // and does not exist on a touch screen, so the only way to sign out
     // would be a mouse. A button with aria-haspopup works for all three.
     el.innerHTML='<div class="whorow">'
       +'<button class="who" id="acctbtn" type="button" '
       +'aria-haspopup="menu" aria-expanded="false" aria-controls="acctmenu" '
       +'title="Your account" aria-label="Your account">'
       +'<svg viewBox="0 0 24 24" aria-hidden="true">'
       +'<circle cx="12" cy="8" r="3.6" fill="currentColor"/>'
       +'<path d="M4.5 20c0-4 3.4-6.2 7.5-6.2s7.5 2.2 7.5 6.2" '
       +'fill="currentColor"/></svg></button>'
       +'<div class="acctmenu" id="acctmenu" role="menu" hidden>'
       +'<a role="menuitem" href="/nfl/account/">Your account</a>'
       +'<button role="menuitem" type="button" id="signout">Sign out</button>'
       +'</div></div>';
     acctMenu(el);
   } else {
     el.innerHTML='<a class="signin" href="'+API+'/auth/google/start">'
       +'Sign in</a>';
   }
   el.hidden=false;
 }).catch(function(){});
})();
