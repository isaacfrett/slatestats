<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slate Stats — Ask anything about NFL fantasy</title><meta name="description" content="Ask any question about NFL players, matchups, injuries and fantasy. Every answer arrives with the sample size behind it and a chart drawn from the same data."><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"><link rel="icon" href="/assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/assets/icon.svg"><meta property="og:site_name" content="Slate Stats"><meta property="og:title" content="Slate Stats — Ask anything about NFL fantasy"><meta property="og:description" content="Ask any question about NFL players, matchups, injuries and fantasy. Every answer arrives with the sample size behind it and a chart drawn from the same data."><meta property="og:image" content="https://slatestats.com/assets/og.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://slatestats.com/assets/og.png"><link rel="stylesheet" href="/assets/site.css"><script>window.SLATE_API="https://api.slatestats.com"</script><link rel="canonical" href="https://slatestats.com/"><meta property="og:url" content="https://slatestats.com/"><meta property="og:type" content="website"></head><body><div class="app"><aside class="side"><a class="brand" href="/"><svg class="mk" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="34" width="8" height="18" rx="2" fill="currentColor" opacity=".5"/><rect x="17" y="12" width="8" height="40" rx="2" fill="var(--green)"/><rect x="28" y="22" width="8" height="30" rx="2" fill="currentColor" opacity=".8"/><rect x="39" y="32" width="8" height="20" rx="2" fill="currentColor" opacity=".6"/><rect x="50" y="40" width="8" height="12" rx="2" fill="currentColor" opacity=".4"/></svg>Slate<span>Stats</span></a><div class="srch"><input id="q" type="search" placeholder="Search players" autocomplete="off" aria-label="Search players, teams and studies"><div id="res" class="res" hidden></div></div><div><div class="lab">NFL</div><nav><a href="/" aria-current=page>Ask</a><a href="/nfl/my-team/">My team</a><a href="/nfl/rankings/">Rankings</a><a href="/nfl/cheat-sheet/">Cheat sheet</a><a href="/nfl/waivers/">Waivers</a><a href="/nfl/streaks/">Streaks</a><a href="/nfl/injury-impact/">Injury impact</a><a href="/nfl/compare/">Compare</a><a href="/nfl/teams/">Teams</a></nav></div><div class="acct" id="acct" hidden></div><div class="foot"><a href="/nfl/studies/">Studies</a><a href="/nfl/faq/">Fantasy questions</a><a href="/nfl/players/">All players</a><a href="mailto:hello@slatestats.com">hello@slatestats.com</a></div></aside><div class="main"><style>
/* The conversation only. The shell (.app/.side/.main) lives in the shared
   stylesheet because every page uses it now. */
.chat{display:flex;flex-direction:column;flex:1;min-height:0}
body{margin:0;background:var(--ground);color:var(--ink);
 font:400 16px/1.55 'IBM Plex Sans',system-ui,sans-serif}

.thread{flex:1;overflow-y:auto;padding:26px 24px 8px}
.inner{max-width:720px;margin:0 auto;width:100%}

/* Empty state: the box is the page, centred, nothing else asking to be read. */
.chat.empty .thread{display:flex;align-items:center;justify-content:center}
.chat.empty .composer{border-top:0;background:transparent}
.chat.empty .cwrap{max-width:720px}
.hello{font:800 30px/1.2 Archivo,sans-serif;letter-spacing:-.02em;
 text-align:center;margin:0 0 22px}
.chat:not(.empty) .hello,.chat:not(.empty) .eg{display:none}

.composer{border-top:1px solid var(--rule);background:var(--ground);
 padding:14px 24px 20px;position:sticky;bottom:0}
.cwrap{max-width:720px;margin:0 auto}
.cbox{display:flex;gap:8px;align-items:flex-end;background:var(--surface);
 border:1px solid var(--rule);border-radius:14px;padding:8px 8px 8px 16px}
.cbox:focus-within{border-color:var(--navy)}
#ask{flex:1;border:0;outline:0;background:transparent;color:var(--ink);
 font:400 16px/1.5 'IBM Plex Sans',sans-serif;resize:none;max-height:180px;
 padding:8px 0}
#send{border:0;border-radius:9px;background:var(--navy);color:#fff;
 width:36px;height:36px;cursor:pointer;font-size:17px;flex:none}
#send:disabled{opacity:.35;cursor:default}
.eg{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}
.eg button{border:1px solid var(--rule);background:var(--surface);
 color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:13px;
 cursor:pointer;font-family:inherit}
.eg button:hover{border-color:var(--navy);color:var(--ink)}
#fresh{margin-top:10px;font-size:11.5px;color:var(--ink-3);text-align:center;
 line-height:1.5}
#popular{max-width:620px;margin:26px auto 0;text-align:center}
#popular .plab{font:600 11px Archivo,sans-serif;letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
#popular .pq{display:inline-block;margin:0 5px 7px 0;padding:8px 13px;
 border:1px solid var(--rule);border-radius:999px;background:var(--surface);
 color:var(--ink-2);font:inherit;font-size:13.5px;cursor:pointer;
 text-align:left}
#popular .pq:hover{border-color:var(--navy);color:var(--ink)}
.chat:not(.empty) #popular{display:none}

.turn{margin:0 0 26px}
.you{font-weight:600;font-size:17px;margin:0 0 12px;color:var(--ink)}
.bot p{margin:0 0 11px;line-height:1.62}
.bot p:last-child{margin-bottom:0}
.bot .fig{margin:15px 0 4px;overflow-x:auto}
.bot .fig svg{max-width:100%;height:auto;display:block}
.bot .src{margin-top:12px;font-size:12px;color:var(--ink-3)}
.bot .warn{margin-top:11px;padding:9px 12px;border-radius:8px;
 background:var(--warn-soft);border:1px solid var(--warn);font-size:13px;
 color:var(--warn)}
.bot .connect{display:inline-block;margin:12px 0 2px;padding:11px 15px;
 border-radius:9px;background:var(--navy);color:#fff;text-decoration:none;
 font-weight:700;font-size:14.5px;line-height:1.3}
.bot .connect span{display:block;font-weight:400;font-size:12.5px;opacity:.78}
.dots{display:inline-block;color:var(--ink-3);font-size:14px}
.sugg{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.sugg button{border:1px solid var(--rule);background:transparent;
 color:var(--ink-3);border-radius:999px;padding:6px 12px;font-size:12.5px;
 cursor:pointer;font-family:inherit}
.sugg button:hover{border-color:var(--navy);color:var(--ink)}
.sugg a.hit{border:1px solid var(--rule);border-radius:999px;padding:6px 12px;
 font-size:12.5px;color:var(--ink-2);text-decoration:none}
.sugg a.hit i{color:var(--ink-3);font-style:normal}
.sugg a.hit:hover{border-color:var(--navy);color:var(--ink)}

@media(max-width:860px){
 .thread{padding:18px 15px 8px}
 .composer{padding:11px 15px 16px}
 .hello{font-size:24px}
}
</style><div class="chat empty" id="main"><div class="thread" id="thread"><div class="inner" id="inner"><h1 class="hello">What do you want to know?</h1><div id="popular" hidden></div></div></div><div class="composer"><div class="cwrap"><div class="cbox"><textarea id="ask" rows="1" placeholder="Ask about a player, a matchup, an injury, a line…" aria-label="Ask a question"></textarea><button id="send" aria-label="Send">↑</button></div><div class="eg"><button data-q="Who benefits if Puka Nacua sits?">If Nacua sits</button><button data-q="Should I start Bijan Robinson or Kenneth Walker?">Bijan or Walker</button><button data-q="Is any defense actually weak against tight ends?">Weak vs tight ends?</button><button data-q="What are the best bets this week?">Best bets</button><button data-q="Who are the top waiver adds this week?">Top waiver adds</button></div><div id="fresh" hidden></div></div></div></div><script>
(function(){
 // WHERE THE ASSISTANT LIVES. On a laptop it is this same origin; in
 // production the pages are static files on a CDN and the assistant is a
 // process on a box with the warehouse, so it is a different host. Baked in
 // at build time rather than guessed at runtime, and falling back to the
 // same origin keeps local development working with no configuration.
 var API = (window.SLATE_API || '').replace(/\/$/, '');
 var box=document.getElementById('ask'), send=document.getElementById('send'),
     thread=document.getElementById('thread'), main=document.getElementById('main'),
     inner=document.getElementById('inner'), busy=false, ctx=null;
 if(!box) return;
 function esc(t){ return String(t==null?'':t)
   .replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;',
     '>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 function paras(t){ return esc(t).split(/\n\n+/)
   .map(function(p){ return '<p>'+p.replace(/\n/g,'<br>')+'</p>'; }).join(''); }
 function grow(){ box.style.height='auto';
   box.style.height=Math.min(box.scrollHeight,180)+'px'; }
 function bottom(){ thread.scrollTop=thread.scrollHeight; }

 function turn(q){
   var d=document.createElement('div'); d.className='turn';
   d.innerHTML='<p class="you">'+esc(q)+'</p>'
     +'<div class="bot"><span class="dots">Working through the data\u2026</span></div>';
   inner.appendChild(d); bottom(); return d.querySelector('.bot');
 }

 // WHEN THERE IS NO ASSISTANT, FALL BACK TO SOMETHING THAT WORKS.
 // The published site is static files on a CDN and /api/ask does not exist
 // there. Without this the front page is a box that always errors, which is
 // worse than the board it replaced. The search index IS static, so the same
 // typed words still find a player, a team or a study -- the question box
 // quietly becomes a search box rather than a broken one.
 var IX=null;
 function index(){ if(IX) return Promise.resolve(IX);
   return fetch('/data/search.json').then(function(x){return x.json();})
     .then(function(j){IX=j;return j;}); }
 function offline(slot,q,why){
   index().then(function(j){
     var k=q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
       .filter(function(w){return w.length>2;});
     var hits=j.filter(function(it){
       return k.some(function(w){ return it.k.indexOf(w)>=0; }); }).slice(0,6);
     var html='<p>The live assistant is not running on this page yet, so I '
       +'cannot answer that one here. These pages match what you typed, and '
       +'every number on them carries its sample size:</p>';
     html += hits.length
       ? '<div class="sugg">'+hits.map(function(it){
           return '<a class="hit" href="'+it.u+'">'+esc(it.n)
             +' <i>'+esc(it.s)+'</i></a>'; }).join('')+'</div>'
       : '<div class="sugg">'
         +'<a class="hit" href="/nfl/rankings/">Rankings</a>'
         +'<a class="hit" href="/nfl/injury-impact/">Injury impact</a>'
         +'<a class="hit" href="/nfl/studies/">Studies</a></div>';
     if(why) html+='<div class="src">'+esc(why)+'</div>';
     slot.innerHTML=html; bottom();
   }).catch(function(){
     slot.innerHTML='<p>The assistant is not available here yet.</p>';
   });
 }

 function ask(q){
   if(!q||busy) return;
   busy=true; send.disabled=true; main.classList.remove('empty');
   box.value=''; grow();
   var slot=turn(q);
   fetch(API+'/api/ask',{method:'POST',headers:{'content-type':'application/json'},
     body:JSON.stringify({q:q, context:ctx})})
   .then(function(x){ return x.json(); })
   .then(function(j){
     busy=false; send.disabled=false;
     // THE LIMIT IS NOT AN ERROR, so it must not render as one. A person
     // who has used their free questions gets a plain sentence about what
     // happened, not the offline fallback for a broken endpoint.
     if(j.limit_reached){
       // RENDERED IN THE READER'S OWN TIMEZONE. The server sends an instant
       // and has no idea where they are; only the browser does.
       var when='';
       if(j.resets_at){
         var d=new Date(j.resets_at);
         if(!isNaN(d)){
           var today=new Date().toDateString()===d.toDateString();
           when=' You can ask again '+(today?'at ':'tomorrow at ')
             +d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
             +(today?'':'')+'.';
         }
       }
       slot.innerHTML='<p>'+esc(j.error)+esc(when)+'</p>'
         +'<p class="src">Everything else on the site stays open \u2014 '
         +'rankings, injury impact, compare and the studies all work '
         +'without asking.</p>'
         +'<div class="sugg"><a class="hit" href="/nfl/rankings/">Rankings</a>'
         +'<a class="hit" href="/nfl/injury-impact/">Injury impact</a>'
         +'<a class="hit" href="/nfl/studies/">Studies</a></div>';
       bottom(); return; }
     if(j.error){ offline(slot,q,j.error); bottom(); return; }
     ctx = j.context || ctx;
     var t=(j.tools||[]);
     var html = paras(j.answer);
     if(j.connect) html += '<a class="connect" href="'+esc(j.connect.url)+'">'
       +esc(j.connect.label)+'<span>'+esc(j.connect.note)+'</span></a>';
     // SERVER-RENDERED SVG, drawn by code from the same tool result the
     // words came from. Never anything a model wrote.
     if(j.visual) html += '<div class="fig">'+j.visual+'</div>';
     if(j.unverified && j.unverified.length)
       html += '<div class="warn">Some figures here could not be traced to a '
         +'measurement: '+esc(j.unverified.join(', '))+'.</div>';
     var left = (j.questions_left===0||j.questions_left)
       ? ' \u00b7 '+j.questions_left+' free question'
         +(j.questions_left===1?'':'s')+' left' : '';
     html += '<div class="src">'+(t.length?('Answered from: '+esc(t.join(', ')))
       :'No tools were needed')+(j.routed?' \u00b7 no model needed':'')
       +left+'</div>';
     if(j.follow_ups && j.follow_ups.length)
       html += '<div class="sugg">'+j.follow_ups.map(function(f){
         return '<button>'+esc(f)+'</button>'; }).join('')+'</div>';
     slot.innerHTML=html; bottom();
   })
   .catch(function(){ busy=false; send.disabled=false; offline(slot,q); });
 }

 box.addEventListener('input',grow);
 box.addEventListener('keydown',function(e){
   // Enter sends, shift+Enter makes a new line -- the convention everywhere
   // else a person types into a conversation.
   if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); ask(box.value.trim()); }
 });
 send.onclick=function(){ ask(box.value.trim()); };
 document.addEventListener('click',function(e){
   var b=e.target.closest('.eg button, .sugg button, .pq');
   if(b) ask(b.dataset.q||b.textContent);
 });
 // DATA AGE, SHOWN WITHOUT BEING ASKED. Someone deciding whether to ask
 // about a line needs to know the line is two days old, and they will not
 // think to ask. Loaded separately so it costs nothing and never blocks.
 fetch('/api/freshness').then(function(x){return x.json();}).then(function(j){
   if(!j || !j.ok) return;
   var s=(j.data.sources||[]).map(function(r){
     return esc(r.source)+' '+esc(r.updated); }).join(' \u00b7 ');
   var el=document.getElementById('fresh');
   if(el && s){ el.innerHTML='Data: '+s; el.hidden=false; }
 }).catch(function(){});

 // WHAT OTHER PEOPLE ARE ASKING. Only the question is reused; clicking one
 // runs it like any other, so nothing here can serve a stale answer.
 fetch(API+'/api/popular').then(function(x){return x.json();})
  .then(function(j){
   var el=document.getElementById('popular');
   if(!el || !j.questions || j.questions.length < 3) return;
   el.innerHTML='<div class="plab">What people are asking</div>'
     + j.questions.map(function(p){
         return '<button class="pq">'+esc(p.q)+'</button>'; }).join('');
   el.hidden=false;
  }).catch(function(){});

 box.focus();
})();
</script><script>
(function(){
 // RUNS ON EVERY PAGE. It lived inside the chat script, so the sidebar on
 // a rankings or study page never learned who was reading and showed no way
 // to sign in at all.
 var API=(window.SLATE_API||'').replace(/\/$/,'');
 var el=document.getElementById('acct'); if(!el) return;
 function esc(t){ return String(t==null?'':t)
   .replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;',
     '>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
 // The API is a different origin, so the cookie only travels when the
 // request asks for it. Without this everyone looks signed out forever.
 fetch(API+'/api/me',{credentials:'include'})
  .then(function(x){return x.json();}).then(function(j){
   if(j.signed_in){
     // NO IDENTITY IN THE SIDEBAR. It showed the part of the address
     // before the @, which is not a name and is PII on a panel that gets
     // read over shoulders. A name would be fine, but we cannot promise
     // one for every provider -- Apple lets people hide even that -- and a
     // field that is a name for some users and an address fragment for
     // others is not a field worth having. The icon says "you are signed
     // in"; the account page, which you open deliberately, says who.
     el.innerHTML='<a class="who" href="/nfl/account/">'
       +'<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">'
       +'<circle cx="12" cy="8" r="3.6" fill="currentColor"/>'
       +'<path d="M4.5 20c0-4 3.4-6.2 7.5-6.2s7.5 2.2 7.5 6.2" '
       +'fill="currentColor"/></svg> Account</a>'
       +'<span class="tier">'+esc(j.tier_label)+'</span><br>'
       +'<a class="out" href="'+API+'/auth/signout">Sign out</a>';
   } else {
     el.innerHTML='<a class="signin" href="'+API+'/auth/google/start">'
       +'Sign in with Google</a>';
   }
   el.hidden=false;
 }).catch(function(){});
})();
</script></body></html>
